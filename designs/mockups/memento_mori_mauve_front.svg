<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000">
  <defs>
    <!-- Shadow filter -->
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.3"/>
    </filter>
    <!-- Fabric texture -->
    <pattern id="fabric" x="0" y="0" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" fill="#B5838D"/>
      <circle cx="2" cy="2" r="0.3" fill="rgba(0,0,0,0.05)"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="1000" fill="#f5f5f0"/>

  <!-- T-shirt body -->
  <g filter="url(#shadow)">
    <!-- Main body -->
    <path d="M 200 150 L 200 800 Q 200 850 250 850 L 550 850 Q 600 850 600 800 L 600 150 Z"
          fill="url(#fabric)" stroke="#333" stroke-width="1"/>

    <!-- Sleeves -->
    <path d="M 200 150 L 150 180 L 150 280 L 200 300 Z"
          fill="url(#fabric)" stroke="#333" stroke-width="1"/>
    <path d="M 600 150 L 650 180 L 650 280 L 600 300 Z"
          fill="url(#fabric)" stroke="#333" stroke-width="1"/>

    <!-- Neckline -->
    <ellipse cx="400" cy="150" rx="60" ry="30"
             fill="#B5838D" stroke="#333" stroke-width="1"/>

    <!-- Ribbing details -->
    <line x1="250" y1="850" x2="550" y2="850" stroke="#333" stroke-width="0.5" opacity="0.3"/>
    <line x1="150" y1="280" x2="200" y2="300" stroke="#333" stroke-width="0.5" opacity="0.3"/>
    <line x1="650" y1="280" x2="600" y2="300" stroke="#333" stroke-width="0.5" opacity="0.3"/>
  </g>

  <!-- Design placement (FRONT) -->
  <g transform="translate(400, 450) scale(1.0)">
    <!-- Moon phases arc (top) -->
    <g transform="translate(0, -120)">
      <!-- New moon -->
      <circle cx="-80" cy="0" r="8" fill="none" stroke="#FFF0F5" stroke-width="1.5"/>
      <!-- Waxing crescent -->
      <circle cx="-40" cy="-5" r="8" fill="#FFF0F5" opacity="0.3"/>
      <path d="M -45,-5 A 8,8 0 0,1 -45,3 A 5,8 0 0,0 -45,-5" fill="#FFF0F5"/>
      <!-- Full moon -->
      <circle cx="0" cy="-8" r="10" fill="#FFF0F5"/>
      <!-- Waning crescent -->
      <circle cx="40" cy="-5" r="8" fill="#FFF0F5" opacity="0.3"/>
      <path d="M 45,-5 A 8,8 0 0,0 45,3 A 5,8 0 0,1 45,-5" fill="#FFF0F5"/>
      <!-- New moon -->
      <circle cx="80" cy="0" r="8" fill="none" stroke="#FFF0F5" stroke-width="1.5"/>
    </g>

    <!-- Main skull (side profile) -->
    <g transform="translate(-10, 0)">
      <!-- Cranium -->
      <ellipse cx="0" cy="-20" rx="45" ry="50" fill="#FFF5EE" stroke="#4A4A4A" stroke-width="2"/>

      <!-- Forehead slope -->
      <path d="M -30,-50 Q -40,-30 -42,0" fill="#FFF5EE" stroke="#4A4A4A" stroke-width="2"/>

      <!-- Eye socket -->
      <ellipse cx="-15" cy="-15" rx="18" ry="22" fill="#7A8A6E" opacity="0.3" stroke="#4A4A4A" stroke-width="2"/>

      <!-- Nasal cavity -->
      <path d="M -35,0 L -42,10 L -35,15 Z" fill="#7A8A6E" opacity="0.3" stroke="#4A4A4A" stroke-width="2"/>

      <!-- Maxilla (upper jaw) -->
      <path d="M -42,15 Q -45,20 -45,25 L -38,25" fill="#FFF5EE" stroke="#4A4A4A" stroke-width="2"/>

      <!-- Teeth (upper) -->
      <rect x="-45" y="25" width="5" height="8" fill="#FFF5EE" stroke="#4A4A4A" stroke-width="1"/>
      <rect x="-40" y="25" width="5" height="8" fill="#FFF5EE" stroke="#4A4A4A" stroke-width="1"/>
      <rect x="-35" y="25" width="5" height="8" fill="#FFF5EE" stroke="#4A4A4A" stroke-width="1"/>

      <!-- Mandible (lower jaw) -->
      <path d="M -45,33 L -38,33 Q -35,33 -35,36 L -38,45 Q -42,48 -48,45 Q -50,40 -48,35 Z"
            fill="#FFF5EE" stroke="#4A4A4A" stroke-width="2"/>

      <!-- Teeth (lower) -->
      <rect x="-45" y="33" width="5" height="6" fill="#FFF5EE" stroke="#4A4A4A" stroke-width="1"/>
      <rect x="-40" y="33" width="5" height="6" fill="#FFF5EE" stroke="#4A4A4A" stroke-width="1"/>

      <!-- Anatomical details -->
      <path d="M -25,-45 Q -20,-43 -18,-40" stroke="#4A4A4A" stroke-width="1" fill="none" opacity="0.5"/>
      <path d="M -10,-55 Q -5,-53 0,-50" stroke="#4A4A4A" stroke-width="1" fill="none" opacity="0.5"/>
      <circle cx="-8" cy="-35" r="2" fill="#4A4A4A" opacity="0.3"/>

      <!-- Suture lines -->
      <path d="M 20,-30 Q 15,-25 10,-20" stroke="#4A4A4A" stroke-width="0.8" fill="none" opacity="0.4" stroke-dasharray="2,2"/>
    </g>

    <!-- Wildflowers growing from skull -->
    <!-- Lavender sprigs (from eye socket) -->
    <g transform="translate(-15, -15)">
      <line x1="0" y1="0" x2="-5" y2="-35" stroke="#7A8A6E" stroke-width="2"/>
      <circle cx="-5" cy="-38" r="2.5" fill="#8B7D8B"/>
      <circle cx="-6" cy="-42" r="2.5" fill="#8B7D8B"/>
      <circle cx="-4" cy="-46" r="2.5" fill="#8B7D8B"/>
      <line x1="0" y1="0" x2="3" y2="-32" stroke="#7A8A6E" stroke-width="2"/>
      <circle cx="3" cy="-35" r="2.5" fill="#8B7D8B"/>
      <circle cx="2" cy="-39" r="2.5" fill="#8B7D8B"/>
    </g>

    <!-- Roses (from cranium) -->
    <g transform="translate(10, -35)">
      <line x1="0" y1="0" x2="5" y2="-28" stroke="#7A8A6E" stroke-width="2.5"/>
      <!-- Rose bloom -->
      <circle cx="5" cy="-30" r="6" fill="#8B7D8B" opacity="0.8"/>
      <circle cx="5" cy="-30" r="4" fill="#8B7D8B"/>
      <circle cx="5" cy="-30" r="2" fill="#7A8A6E" opacity="0.6"/>
      <!-- Leaves -->
      <ellipse cx="2" cy="-20" rx="4" ry="6" fill="#7A8A6E" opacity="0.7" transform="rotate(-30, 2, -20)"/>
      <ellipse cx="7" cy="-15" rx="4" ry="6" fill="#7A8A6E" opacity="0.7" transform="rotate(20, 7, -15)"/>
    </g>

    <!-- Forget-me-nots cluster (from cranium top) -->
    <g transform="translate(-5, -55)">
      <line x1="0" y1="0" x2="-3" y2="-18" stroke="#7A8A6E" stroke-width="1.5"/>
      <!-- 5-petal flowers -->
      <g transform="translate(-3, -20)">
        <circle cx="0" cy="0" r="4" fill="#8B7D8B"/>
        <circle cx="-3" cy="-2" r="1.5" fill="#FFF0F5"/>
        <circle cx="3" cy="-2" r="1.5" fill="#FFF0F5"/>
        <circle cx="-2" cy="3" r="1.5" fill="#FFF0F5"/>
        <circle cx="2" cy="3" r="1.5" fill="#FFF0F5"/>
        <circle cx="0" cy="-4" r="1.5" fill="#FFF0F5"/>
        <circle cx="0" cy="0" r="1" fill="#FFD700"/>
      </g>
      <g transform="translate(-7, -15)">
        <circle cx="0" cy="0" r="3.5" fill="#8B7D8B"/>
        <circle cx="-2" cy="-1.5" r="1.3" fill="#FFF0F5"/>
        <circle cx="2" cy="-1.5" r="1.3" fill="#FFF0F5"/>
        <circle cx="-1.5" cy="2.5" r="1.3" fill="#FFF0F5"/>
        <circle cx="1.5" cy="2.5" r="1.3" fill="#FFF0F5"/>
        <circle cx="0" cy="-3.5" r="1.3" fill="#FFF0F5"/>
        <circle cx="0" cy="0" r="0.8" fill="#FFD700"/>
      </g>
    </g>

    <!-- Wild daisies (from jaw area) -->
    <g transform="translate(-35, 20)">
      <line x1="0" y1="0" x2="8" y2="-22" stroke="#7A8A6E" stroke-width="1.8"/>
      <g transform="translate(8, -24)">
        <circle cx="0" cy="0" r="5" fill="#FFF5EE"/>
        <ellipse cx="-4" cy="0" rx="2" ry="4" fill="#FFF5EE"/>
        <ellipse cx="4" cy="0" rx="2" ry="4" fill="#FFF5EE"/>
        <ellipse cx="0" cy="-4" rx="4" ry="2" fill="#FFF5EE"/>
        <ellipse cx="0" cy="4" rx="4" ry="2" fill="#FFF5EE"/>
        <circle cx="0" cy="0" r="2" fill="#FFD700"/>
      </g>
    </g>

    <!-- Small snail detail -->
    <g transform="translate(30, 40)">
      <ellipse cx="0" cy="0" rx="4" ry="3" fill="#7A8A6E" opacity="0.6"/>
      <circle cx="-2" cy="-2" r="3" fill="#8B7D8B" opacity="0.5"/>
      <path d="M -2,-2 Q 0,-4 2,-2" stroke="#4A4A4A" stroke-width="0.8" fill="none"/>
      <line x1="0" y1="2" x2="-1" y2="5" stroke="#4A4A4A" stroke-width="0.6"/>
      <line x1="2" y1="2" x2="3" y2="5" stroke="#4A4A4A" stroke-width="0.6"/>
    </g>

    <!-- Roots at bottom -->
    <g transform="translate(-10, 50)">
      <path d="M 0,0 Q -5,8 -8,15 Q -10,20 -12,28" stroke="#7A8A6E" stroke-width="1.5" fill="none" opacity="0.7"/>
      <path d="M 0,0 Q 2,10 0,18 Q -2,25 0,32" stroke="#7A8A6E" stroke-width="1.5" fill="none" opacity="0.7"/>
      <path d="M 0,0 Q 5,7 8,14 Q 10,22 8,30" stroke="#7A8A6E" stroke-width="1.5" fill="none" opacity="0.7"/>
    </g>

    <!-- Quote text (bottom) -->
    <text x="0" y="95" font-family="Georgia, serif" font-size="11" fill="#4A4A4A"
          text-anchor="middle" font-style="italic" opacity="0.9">
      From death, life blooms
    </text>
  </g>
</svg>